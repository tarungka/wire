version: "2"
run:
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: Error return value of .((Close|Write).*) is not checked
      - path: (.+)\.go$
        text: 'SA1019:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/tarungka/wire
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
