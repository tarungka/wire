version: "2"
run:
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  exclusions:
    generated: lax
    rules:
      # errcheck on defer'd Close/Write/Shutdown/Sync is the standard
      # idiom in this repo; exclude it. The original pattern was written
      # against v1's "of (Close)" output and doesn't match v2's
      # backtick-quoted form ("of `resp.Body.Close`"). This pattern
      # matches both by anchoring on the suffix method-call shape.
      - path: (.+)\.go$
        text: 'Error return value of .*\.(Close|Write|Shutdown|Sync)`? is not checked'
      - path: (.+)\.go$
        text: 'SA1019:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/tarungka/wire
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
